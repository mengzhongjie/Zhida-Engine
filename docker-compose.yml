services:
  zhida-engine:
    build:
      context: .
      args:
        # 可在服务器 .env 中覆盖：PIP_INDEX_URL=https://pypi.org/simple
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    restart: unless-stopped
    ports:
      - "127.0.0.1:18900:18900"
    # .env 不提交到 Git。它存放域名、会话密钥及其他部署私有配置。
    env_file:
      - .env
    environment:
      ZHIDA_API_HOST: "0.0.0.0"
      ZHIDA_API_PORT: "18900"
      ZHIDA_DATA_DIR: "/data"
      ZHIDA_EMBEDDING_MODE: "cloud"
    volumes:
      - ./data:/data
